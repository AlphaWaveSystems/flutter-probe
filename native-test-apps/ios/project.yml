name: ProbeNativeTest
options:
  bundleIdPrefix: com.alphawavesystems
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  ProbeNativeTest:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Probe Native Test
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alphawavesystems.probenativetest
        PRODUCT_NAME: ProbeNativeTest
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
