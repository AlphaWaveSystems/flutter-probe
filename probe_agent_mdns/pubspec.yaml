name: flutter_probe_agent_mdns
description: >-
  Optional mDNS/Bonjour advertising for flutter_probe_agent, so FlutterProbe
  Studio can discover physical devices on your network. Kept separate so the
  core agent has no native plugin in your app.

version: 0.15.0
homepage: https://flutterprobe.dev
repository: https://github.com/AlphaWaveSystems/flutter-probe
issue_tracker: https://github.com/AlphaWaveSystems/flutter-probe/issues

topics:
  - testing
  - e2e
  - flutter
  - mdns

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_probe_agent: ^0.15.0
  bonsoir: ^5.1.10

dev_dependencies:
  flutter_test:
    sdk: flutter

# Path-based reference to the local agent during development. Overrides are
# ignored by `dart pub publish` — the version constraint above is what
# consumers get.
dependency_overrides:
  flutter_probe_agent:
    path: ../probe_agent
