name: Dependabot Compatibility

# Runs on Dependabot PRs to ensure dependency updates don't break anything.
# Checks: compatibility, security, license compliance, then auto-merges safe updates.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Determine what changed ----
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    outputs:
      go: ${{ steps.filter.outputs.go }}
      npm: ${{ steps.filter.outputs.npm }}
      actions: ${{ steps.filter.outputs.actions }}
      go_studio: ${{ steps.filter.outputs.go_studio }}
      npm_studio: ${{ steps.filter.outputs.npm_studio }}
      npm_vscode: ${{ steps.filter.outputs.npm_vscode }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - 'go.mod'
              - 'go.sum'
              - 'tools/probe-convert/go.mod'
              - 'tools/probe-convert/go.sum'
            npm:
              - 'website/package.json'
              - 'website/package-lock.json'
            actions:
              - '.github/workflows/**'
            go_studio:
              - 'studio/go.mod'
              - 'studio/go.sum'
            npm_studio:
              - 'studio/frontend/package.json'
              - 'studio/frontend/package-lock.json'
            npm_vscode:
              - 'vscode/package.json'
              - 'vscode/package-lock.json'

  # ---- Go dependency updates ----
  go-compat:
    name: Go compatibility
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          check-latest: true
          cache: true

      - name: Verify dependencies resolve
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Build CLI
        run: go build -o bin/probe ./cmd/probe/

      - name: Go vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Staticcheck
        run: staticcheck ./...

      - name: Unit tests
        run: go test ./... -count=1 -race -timeout 5m

      - name: Build probe-convert
        run: cd tools/probe-convert && go build -o ../../bin/probe-convert .

      - name: probe-convert vet + staticcheck
        run: cd tools/probe-convert && go vet ./... && staticcheck ./...

      - name: probe-convert tests
        run: cd tools/probe-convert && go test ./... -count=1 -timeout 5m

      - name: Cross-compile check
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/probe/
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/probe/
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/probe/

      - name: Backward compatibility — lint existing .probe files
        run: |
          bin/probe lint tests/ 2>&1 || true
          # Ensure parser still handles all existing test syntax
          for f in tests/*.probe tests/**/*.probe; do
            if [ -f "$f" ]; then
              bin/probe lint "$f" > /dev/null 2>&1 || {
                echo "ERROR: Parser broke on $f"
                exit 1
              }
            fi
          done
          echo "✓ All .probe files still parse"

  # ---- npm dependency updates (website) ----
  npm-compat:
    name: Website compatibility
    needs: changes
    if: needs.changes.outputs.npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: cd website && npm ci

      - name: Build website
        run: cd website && npm run build

      - name: Verify sitemap generated
        run: test -f website/dist/sitemap-index.xml

      - name: Verify page count
        run: |
          COUNT=$(find website/dist -name 'index.html' | wc -l | tr -d ' ')
          echo "Built $COUNT pages"
          if [ "$COUNT" -lt 30 ]; then
            echo "ERROR: Expected 30+ pages, got $COUNT"
            exit 1
          fi

      - name: Check for broken internal links
        run: |
          cd website/dist
          for page in getting-started/installation getting-started/quick-start \
                      probescript/syntax comparisons/flutter-e2e-testing \
                      blog/guide-to-flutter-e2e-testing; do
            if [ ! -f "$page/index.html" ]; then
              echo "ERROR: Missing page: $page"
              exit 1
            fi
          done
          echo "✓ All key pages present"

  # ---- GitHub Actions updates ----
  actions-compat:
    name: Actions compatibility
    needs: changes
    if: needs.changes.outputs.actions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          check-latest: true
          cache: true

      - name: Build CLI
        run: go build -o bin/probe ./cmd/probe/

      - name: Unit tests
        run: go test ./... -count=1 -timeout 5m

  # ---- Security audit ----
  # The npm audit runs for every npm project whose files changed (the website, Studio's frontend, the VS Code extension); it fails on a high or critical
  # finding in a production dependency. A finding in a dev dependency (the two moderate minimatch ones in vsce, today) is known and does not fail it.
  security:
    name: Security audit
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.npm == 'true' || needs.changes.outputs.npm_studio == 'true' || needs.changes.outputs.npm_vscode == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: needs.changes.outputs.go == 'true'
        with:
          go-version: "1.26.10"
          check-latest: true
          cache: true

      - name: Go vulnerability check
        if: needs.changes.outputs.go == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "=== Main module ==="
          govulncheck ./... || true
          echo "=== probe-convert ==="
          cd tools/probe-convert && govulncheck ./... || true

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.npm == 'true' || needs.changes.outputs.npm_studio == 'true' || needs.changes.outputs.npm_vscode == 'true'
        with:
          node-version: "22.23.4"

      - name: npm audit
        if: needs.changes.outputs.npm == 'true' || needs.changes.outputs.npm_studio == 'true' || needs.changes.outputs.npm_vscode == 'true'
        env:
          CHANGED_WEBSITE: ${{ needs.changes.outputs.npm }}
          CHANGED_STUDIO: ${{ needs.changes.outputs.npm_studio }}
          CHANGED_VSCODE: ${{ needs.changes.outputs.npm_vscode }}
        run: |
          dirs=""
          if [ "$CHANGED_WEBSITE" = "true" ]; then dirs="$dirs website"; fi
          if [ "$CHANGED_STUDIO" = "true" ]; then dirs="$dirs studio/frontend"; fi
          if [ "$CHANGED_VSCODE" = "true" ]; then dirs="$dirs vscode"; fi
          for d in $dirs; do
            echo "=== npm audit: $d ==="
            (cd "$d" && npm ci --ignore-scripts --no-fund)
            (cd "$d" && npm audit --omit=dev || true)
            # Fail only on critical/high vulnerabilities of production dependencies
            (cd "$d" && npm audit --omit=dev --audit-level=high)
          done

  # ---- License compliance ----
  # FlutterProbe is BSL 1.1 (CLI) and MIT (parts of the repository): a dependency under a strong copyleft licence (GPL, AGPL, SSPL, EUPL) that is mandatory for
  # its users cannot be shipped. scripts/licensecheck reads the licence EXPRESSION (the old `license-checker --failOn` compared the whole string with a list, so
  # "GPL-3.0-or-later" and "(GPL-3.0 AND MIT)" passed it). It checks the three Go modules and the three npm projects; an LGPL, unknown or custom licence is a note,
  # and the reviewed ones are in scripts/licensecheck/allowlist.txt, each with a reason. The check tests itself first, so it cannot rot unnoticed.
  license:
    name: License compliance
    needs: changes
    if: >-
      needs.changes.outputs.go == 'true' || needs.changes.outputs.go_studio == 'true' || needs.changes.outputs.npm == 'true' ||
      needs.changes.outputs.npm_studio == 'true' || needs.changes.outputs.npm_vscode == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          check-latest: true
          cache: true

      - uses: actions/setup-node@v7
        if: needs.changes.outputs.npm == 'true' || needs.changes.outputs.npm_studio == 'true' || needs.changes.outputs.npm_vscode == 'true'
        with:
          node-version: "22.23.4"

      - name: Self-test of the licence check
        run: go test ./scripts/licensecheck/ -count=1

      - name: Check dependency licenses
        env:
          CHANGED_GO: ${{ needs.changes.outputs.go }}
          CHANGED_GO_STUDIO: ${{ needs.changes.outputs.go_studio }}
          CHANGED_WEBSITE: ${{ needs.changes.outputs.npm }}
          CHANGED_STUDIO: ${{ needs.changes.outputs.npm_studio }}
          CHANGED_VSCODE: ${{ needs.changes.outputs.npm_vscode }}
        run: |
          targets=""
          if [ "$CHANGED_GO" = "true" ] || [ "$CHANGED_GO_STUDIO" = "true" ]; then
            go install github.com/google/go-licenses@v1.6.0
            targets="$targets go"
          fi
          if [ "$CHANGED_WEBSITE" = "true" ]; then targets="$targets npm:website"; fi
          if [ "$CHANGED_STUDIO" = "true" ]; then targets="$targets npm:studio/frontend"; fi
          if [ "$CHANGED_VSCODE" = "true" ]; then targets="$targets npm:vscode"; fi
          # the same script as license-check.yml; the tool is this checkout's (a Dependabot branch changes manifests only)
          bash scripts/licensecheck/check-all.sh "$PWD" "$PWD" "$RUNNER_TEMP/licences" $targets

  # ---- Auto-approve safe updates ----
  # Auto-merge is intentionally NOT triggered here — the 7-day soak period is
  # enforced by dependabot-automerge.yml (scheduled daily). Major updates are
  # left for manual review regardless.
  auto-approve:
    name: Auto-merge
    needs: [go-compat, npm-compat, actions-compat, security, license]
    if: |
      always() &&
      github.actor == 'dependabot[bot]' &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve patch and minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on major updates (require manual review)
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "⚠️ **Major version update** — auto-merge skipped. Please review breaking changes before merging.

          All compatibility checks passed:
          - ✓ Build + tests
          - ✓ Security audit
          - ✓ License compliance
          - ✓ Backward compatibility"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
