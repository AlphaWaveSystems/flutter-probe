name: Design partner application
description: Apply to try Probe Cloud, the hosted report service in preview, as a design partner.
title: "Design partner: "
labels: ["design-partner"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public.** Everything you write here can be read by anyone. If you prefer, email support@alphawavesystems.com instead.

        Probe Cloud is a preview and the hosted service is not live yet. The first 10 teams get this offer. Probe Cloud is free for design partners while we test it. When paid plans open, you get 50% off the plan you subscribe to, for as long as you stay subscribed. In return, use it on a real project and send us short notes. This is a beta: we may change or end it, including the 50% discount.
  - type: input
    id: team
    attributes:
      label: Team name
      description: The team or company that would use Probe Cloud.
    validations:
      required: true
  - type: input
    id: repo-owner
    attributes:
      label: GitHub owner of the repository
      description: The user or organization that owns the repository you would upload reports from, for example `my-org`.
    validations:
      required: true
  - type: dropdown
    id: ci
    attributes:
      label: CI provider
      description: The upload client is built for GitHub Actions runs, and other CI systems are not supported for uploads yet. If you use another one, choose Other and tell us what you use under "What you test today".
      options:
        - GitHub Actions
        - Other
    validations:
      required: true
  - type: checkboxes
    id: devices
    attributes:
      label: Device types
      description: What your tests run on.
      options:
        - label: Android emulator
        - label: iOS simulator
        - label: Physical device
  - type: textarea
    id: today
    attributes:
      label: What you test today
      description: Your app's main flows, how you test them now, and what you want to see in test reports.
    validations:
      required: true
  - type: input
    id: team-size
    attributes:
      label: Team size (optional)
      description: How many people work on the app, for example 4 developers. You can leave it empty.
    validations:
      required: false
  - type: dropdown
    id: source
    attributes:
      label: How did you hear about us (optional)
      description: You can leave it empty.
      options:
        - Search
        - GitHub
        - pub.dev
        - A person
        - A post
        - Other
    validations:
      required: false
  - type: input
    id: email
    attributes:
      label: Contact email (optional)
      description: "This issue is public: an email address here is visible to everyone. Leave it empty and we reply on the issue, or email support@alphawavesystems.com instead."
    validations:
      required: false
